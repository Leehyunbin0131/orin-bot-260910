amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.3
    update_min_a: 0.05
    update_min_d: 0.03
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    use_sim_time: false
    set_initial_pose: false
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
    use_sim_time: false
    default_cancel_timeout: 1000
controller_server:
  ros__parameters:
    controller_frequency: 15.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.0001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.0001
    failure_tolerance: 0.0
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 15.0
      required_movement_angle: 0.1
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.15
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.03
      lookahead_dist: 0.35
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.12
      max_angular_accel: 0.08
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.006
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_speed: 0.006
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.35
      allow_reversing: false
    use_sim_time: false
    enable_stamped_cmd_vel: true
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.03
      footprint: '[[-0.38,-0.245],[0.10,-0.245],[0.10,0.245],[-0.38,0.245]]'
      footprint_padding: 0.01
      transform_tolerance: 0.3
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      always_send_full_costmap: true
      rolling_window: true
      width: 3
      height: 3
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.5
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.03
      footprint: '[[-0.38,-0.245],[0.10,-0.245],[0.10,0.245],[-0.38,0.245]]'
      footprint_padding: 0.01
      transform_tolerance: 0.3
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      always_send_full_costmap: true
      track_unknown_space: true
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.5
map_server:
  ros__parameters:
    use_sim_time: false
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: false
