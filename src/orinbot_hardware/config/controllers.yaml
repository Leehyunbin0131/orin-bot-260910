controller_manager:
  ros__parameters:
    use_sim_time: false
    update_rate: 30
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    use_sim_time: false
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    # wheel_radius/separation은 hardware.yaml에서 런치가 주입합니다.
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    open_loop: false
    position_feedback: true
    publish_rate: 30.0
    velocity_rolling_window_size: 5
    cmd_vel_timeout: 0.3
    pose_covariance_diagonal: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.05]
    twist_covariance_diagonal: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.05]
    # Combined translation + rotation stays below XM430 raw velocity 15:
    # (0.006 + 0.020 * 0.44 / 2) / 0.0325 = 0.3200 rad/s < 0.3595.
    linear.x.max_velocity: 0.006
    linear.x.min_velocity: -0.006
    linear.x.max_acceleration: 0.02
    linear.x.max_deceleration: -0.02
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    angular.z.max_velocity: 0.020
    angular.z.min_velocity: -0.020
    angular.z.max_acceleration: 0.04
    angular.z.max_deceleration: -0.04
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: false
