# 휠 엔코더 + IMU 융합 (robot_localization EKF)
#
# 왜 넣는가:
#   지금까지 odom -> base_footprint 는 diff_drive_controller 가 직접
#   발행하고, 시각 오도메트리(rgbd_odometry)가 그 위에서 별도로 돌았습니다.
#   실기(Jetson Orin Nano Super, 6코어 A78AE 1.7GHz)에서는 rgbd_odometry 가
#   전체 CPU 의 20% 를 쓰는 것이 부담입니다 (실측 21.6%).
#
#   실기에는 Dynamixel XM430 의 실제 엔코더와 D435i 의 IMU 가 있습니다.
#   Gazebo 에서 휠 오도메트리에 9% 보정이 필요했던 것은 물리엔진이 원기둥
#   바퀴의 접촉점을 잡는 방식 때문이지 실기의 문제가 아닙니다.
#   엔코더로 병진을, IMU 로 회전을 잡으면 평면 로봇에는 이 조합이 정석입니다.
#
#   전역 오차는 RTAB-Map 의 루프 클로저가 계속 잡아 줍니다.
#   EKF 는 map->odom 이 아니라 odom->base_footprint 만 담당합니다.
#
# 주의: 이 노드를 켜면 controllers.yaml 의 enable_odom_tf 를 false 로
# 두어야 합니다. 둘 다 켜면 같은 TF 를 두 노드가 발행해 TF 가 흔들립니다.
ekf_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true          # 평면 로봇. z/roll/pitch 를 0 으로 고정
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom         # odom -> base_footprint 만 담당

    # ---- 입력 1: 휠 오도메트리 ----
    # 위치(x,y,yaw)는 넣지 않고 속도만 씁니다. 위치를 넣으면 엔코더 드리프트가
    # 그대로 상태에 누적되고, 어차피 world_frame=odom 이라 절대 위치는
    # 의미가 없습니다. 속도만 융합하는 것이 표준 구성입니다.
    # diff_drive_controller 의 ~/odom 이 sim.launch.py 에서 /odom 으로 리맵됨
    odom0: /odom
    odom0_config: [false, false, false,      # x, y, z
                   false, false, false,      # roll, pitch, yaw
                   true,  false, false,      # vx, vy, vz
                   false, false, true,       # vroll, vpitch, vyaw
                   false, false, false]      # ax, ay, az
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # ---- 입력 2: IMU (D435i) ----
    # 각속도만 씁니다.
    #   - orientation 은 쓰지 않습니다. 자력계가 없어 yaw 절대각이
    #     드리프트하고, 그 yaw 를 넣으면 엔코더와 싸웁니다.
    #   - 가속도는 쓰지 않습니다. 평면 주행에서 중력 성분 대비 신호가 작아
    #     오히려 잡음만 들어옵니다 (two_d_mode 라 z 가속도는 버려집니다).
    #
    # 자세를 안 쓰므로 자세 필터(imu_filter_madgwick 등)를 앞에 두지
    # 마세요 — 그 필터가 하는 일이 자세를 만드는 것뿐이라 순수한 낭비입니다.
    # rtabmap 도 Optimizer/GravitySigma=0.0 이라 IMU 자세를 쓰지 않습니다.
    imu0: /camera/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,        # vyaw 만
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    # 프로세스 잡음. 기본값에서 평면 로봇에 안 쓰는 축(z, roll, pitch)을
    # 아주 작게 잡아 EKF 가 그쪽으로 새지 않게 합니다.
    process_noise_covariance: [0.020000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
                               0.000000, 0.020000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
                               0.000000, 0.000000, 0.000001, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
                               0.000000, 0.000000, 0.000000, 0.000001, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
                               0.000000, 0.000000, 0.000000, 0.000000, 0.000001, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
                               0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.010000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
                               0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.005000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
                               0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000001, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
                               0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000001, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
                               0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000001, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
                               0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000001, 0.000000, 0.000000, 0.000000, 0.000000,
                               0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.010000, 0.000000, 0.000000, 0.000000,
                               0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000001, 0.000000, 0.000000,
                               0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000001, 0.000000,
                               0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000001]
